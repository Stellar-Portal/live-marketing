<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Draft review · Stellar</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .review { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .queue { max-height: calc(100vh - 220px); overflow-y: auto; padding: 0; }
  .qi { display: block; width: 100%; text-align: left; background: none; color: var(--ink); border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 14px; font-weight: 400; }
  .qi:hover { background: #f8f7f3; }
  .qi.on { background: #efede7; }
  .qi b { font-weight: 600; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 10px; display: block; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  #detail video { max-height: 56vh; }
  @media (max-width: 860px) { .review { grid-template-columns: 1fr; } .queue { max-height: 280px; } }
</style>
</head>
<body>
<div class="wrap wide" id="app"><p class="muted">Loading…</p></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient(SLM.SUPABASE_URL, SLM.KEY);
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
const LABEL = { empty: "Not uploaded", pending: "To review", changes_requested: "Changes req.", approved: "Approved", posted: "Live" };
function toast(msg, ms = 3000) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

let me = null, campaign = null, campaigns = [], tab = "review", queue = [], creators = [], filter = { q: "", s: "all" };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const draftsOn = () => campaign?.drafts_enabled !== false;

async function loadCampaigns() {
  const { data, error } = await sb.from("campaigns").select("*").eq("active", true).order("sort_order").order("created_at");
  if (error) return toast(error.message);
  campaigns = data || [];
  const saved = store.get("slm:campaign");
  campaign = campaigns.find(c => c.id === (campaign?.id || saved)) || campaigns[0] || null;
  if (campaign) store.set("slm:campaign", campaign.id);
}

async function switchCampaign(id) {
  campaign = campaigns.find(c => c.id === id) || campaign;
  store.set("slm:campaign", campaign.id);
  currentCid = null; urlCache = {}; filter = { q: "", s: "all" }; linksSince = "";
  if (!draftsOn() && tab === "review") tab = "links";
  app.querySelector("#pane") && (app.querySelector("#pane").innerHTML = `<p class="muted">Loading ${esc(campaign.name)}…</p>`);
  await refreshAll();
}

async function teamApi(action, extra = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${SLM.SUPABASE_URL}/functions/v1/team-api`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SLM.KEY, Authorization: `Bearer ${session?.access_token}` },
    body: JSON.stringify({ action, ...extra }),
  });
  const data = await r.json().catch(() => ({ error: "Connection problem" }));
  if (!r.ok || data.error) throw new Error(data.error || "Something went wrong");
  return data;
}

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: tm } = await sb.from("team_members").select("email, name");
  me = (tm || []).find(m => m.email.toLowerCase() === session.user.email.toLowerCase());
  if (!me) {
    app.innerHTML = `<div class="card stack" style="max-width:440px;margin:40px auto"><h1>No access</h1><p class="muted">${esc(session.user.email)} isn't on the review team list. Ask Sam to add you.</p><button class="ghost" id="out">Sign out</button></div>`;
    document.getElementById("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  await loadCampaigns();
  if (!draftsOn()) tab = "links";
  await refreshAll();
  // refresh the queue every minute, but never while someone is typing feedback
  setInterval(() => {
    const typing = document.activeElement?.tagName === "TEXTAREA" || Object.values(fbDrafts).some(x => x && x.trim());
    if (tab === "review" && !typing) loadQueue(true);
  }, 60000);
}

function showLogin() {
  app.innerHTML = `<div class="card stack" style="max-width:440px;margin:40px auto">
    <div class="eyebrow">Stellar · Draft review</div><h1>Sign in</h1>
    <p class="muted" style="margin:0">Enter your Stellar email and we'll send you a sign-in code.</p>
    <form id="lf" class="stack"><input type="email" id="em" placeholder="you@stellarmusic.dk" required autocomplete="email"><button style="width:100%;justify-content:center">Send code</button></form>
    <form id="cf" class="stack hidden"><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from the email" maxlength="12" required><button style="width:100%;justify-content:center">Sign in</button></form>
    <div id="lm"></div></div>`;
  let email = "";
  const msg = (h) => document.getElementById("lm").innerHTML = h;
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault();
    email = document.getElementById("em").value.trim().toLowerCase();
    const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Sending…";
    try {
      const r = await fetch(`${SLM.SUPABASE_URL}/functions/v1/team-login`, {
        method: "POST", headers: { "Content-Type": "application/json", apikey: SLM.KEY }, body: JSON.stringify({ email }),
      });
      const d = await r.json().catch(() => ({ error: "Connection problem" }));
      if (!r.ok || d.error) throw new Error(d.error || "Something went wrong");
      document.getElementById("lf").classList.add("hidden");
      document.getElementById("cf").classList.remove("hidden");
      document.getElementById("code").focus();
      msg(`<div class="note small">Code sent to <b>${esc(email)}</b>. Check your inbox (and spam, the first time).</div>`);
    } catch (err) { msg(`<div class="error">${esc(err.message)}</div>`); b.disabled = false; b.textContent = "Send code"; }
  };
  document.getElementById("cf").onsubmit = async (e) => {
    e.preventDefault();
    const token = document.getElementById("code").value.replace(/\D/g, "");
    let { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
    if (error) ({ error } = await sb.auth.verifyOtp({ email, token, type: "magiclink" }));
    if (error) return msg(`<div class="error">That code didn't work. Check it, or go back and request a new one.</div>`);
    boot();
  };
}

// ---------- shell ----------
async function refreshAll() { await Promise.all([loadQueue(false), loadCreators()]); renderShell(); }

function stats() {
  const slots = creators.flatMap(c => c.slots || []);
  return {
    creators: creators.length,
    invited: creators.filter(c => c.invited_at).length,
    locked: creators.filter(c => c.locked_at).length,
    committed: slots.length,
    pending: queue.filter(v => !v.decision).length,
    approved: slots.filter(s => ["approved", "posted"].includes(s.status)).length,
    live: slots.filter(s => s.status === "posted").length,
  };
}

function renderShell() {
  const s = stats();
  const on = draftsOn();
  if (!on && tab === "review") tab = "links";
  app.innerHTML = `
    <div class="row spread" style="margin-bottom:12px">
      <div class="eyebrow">Stellar · Live Marketing</div>
      <div class="row small muted">${esc(me.name)} · <a href="#" id="out">Sign out</a></div>
    </div>
    <div class="row" style="margin-bottom:16px;gap:8px">
      ${campaigns.map(c => `<button class="${c.id === campaign?.id ? "" : "ghost"}" data-camp="${c.id}">${esc(c.name)}<span class="small" style="font-weight:500;opacity:.75">${c.drafts_enabled === false ? "· links only" : "· drafts"}</span></button>`).join("")}
      <button class="ghost sm" id="newCamp" title="Add a campaign">+ New campaign</button>
    </div>
    ${campaign ? `
    <div class="stats" style="margin-bottom:18px">
      ${on ? `<div class="stat"><b>${s.pending}</b><span>Waiting for review</span></div>` : ""}
      <div class="stat"><b>${s.locked}/${s.creators}</b><span>Creators committed</span></div>
      <div class="stat"><b>${s.committed}</b><span>Videos committed</span></div>
      ${on ? `<div class="stat"><b>${s.approved}</b><span>Approved</span></div>` : ""}
      <div class="stat"><b>${s.live}</b><span>Live on TikTok</span></div>
    </div>
    <div class="tabs">
      ${on ? `<button data-tab="review" class="${tab === "review" ? "on" : ""}">Review queue (${s.pending})</button>` : ""}
      <button data-tab="links" class="${tab === "links" ? "on" : ""}">Posted links (${s.live})</button>
      <button data-tab="creators" class="${tab === "creators" ? "on" : ""}">Creators</button>
      <button data-tab="setup" class="${tab === "setup" ? "on" : ""}">Setup</button>
    </div>
    <div id="pane"></div>` : `<div class="card muted">No campaigns yet. Click “+ New campaign”.</div>`}`;
  document.getElementById("out").onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
  app.querySelectorAll("[data-camp]").forEach(b => b.onclick = () => { if (b.dataset.camp !== campaign?.id) switchCampaign(b.dataset.camp); });
  document.getElementById("newCamp").onclick = async () => {
    const name = prompt("Name of the new campaign (creators will see this name):");
    if (!name || !name.trim()) return;
    const { data, error } = await sb.from("campaigns").insert({ name: name.trim(), sort_order: campaigns.length + 1 }).select().single();
    if (error) return toast(error.message);
    campaigns.push(data); tab = "setup"; await switchCampaign(data.id);
  };
  if (!campaign) return;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderShell(); });
  if (tab === "review") renderReview(); else if (tab === "links") renderLinks(); else if (tab === "creators") renderCreators(); else renderSetup();
}

// ---------- posted links (for copying into the external dashboard) ----------
let linksSince = "";
function postedLinks() {
  return creators.flatMap(c => c.slots.filter(s => s.status === "posted" && s.tiktok_url).map(s => ({
    creator: c.name, handle: (c.tiktok_handle || "").replace(/^@/, ""), country: c.country || "",
    video: s.slot_no, url: s.tiktok_url, posted_at: s.posted_at,
  }))).sort((a, b) => (a.posted_at || "").localeCompare(b.posted_at || ""));
}

function renderLinks() {
  const pane = document.getElementById("pane");
  const all = postedLinks();
  const rows = linksSince ? all.filter(r => r.posted_at && r.posted_at >= new Date(linksSince + "T00:00:00").toISOString()) : all;
  const tsv = (withHead) => (withHead ? ["Creator", "TikTok handle", "Country", "Video", "TikTok link", "Posted"].join("\t") + "\n" : "") +
    rows.map(r => [r.creator, r.handle ? "@" + r.handle : "", r.country, r.video, r.url, r.posted_at ? r.posted_at.slice(0, 10) : ""].join("\t")).join("\n");
  pane.innerHTML = `<div class="stack">
    <div class="row">
      <label class="small muted">Posted since</label>
      <input type="date" id="since" value="${linksSince}" style="max-width:180px">
      ${linksSince ? `<button class="ghost sm" id="clr">Show all</button>` : ""}
      <span class="small muted">${rows.length} link${rows.length === 1 ? "" : "s"}</span>
    </div>
    <div class="row">
      <button id="cpL" ${rows.length ? "" : "disabled"}>Copy links only</button>
      <button class="ghost" id="cpT" ${rows.length ? "" : "disabled"}>Copy as table</button>
      <button class="ghost" id="dl" ${rows.length ? "" : "disabled"}>Download CSV</button>
    </div>
    <p class="small muted" style="margin:0">“Copy links only” gives one TikTok link per line. “Copy as table” pastes straight into Google Sheets or Excel with all columns.</p>
    <div class="card scroll-x" style="padding:6px 10px"><table><thead><tr><th>Creator</th><th>Country</th><th>Video</th><th>TikTok link</th><th>Posted</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r => `<tr><td><b>${esc(r.creator)}</b>${r.handle ? `<br><span class="small muted">@${esc(r.handle)}</span>` : ""}</td><td>${esc(r.country)}</td><td>${r.video}</td>
        <td class="small"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></td><td class="small muted">${fmt(r.posted_at)}</td></tr>`).join("")
        || `<tr><td colspan="5" class="muted center" style="padding:30px">No TikTok links yet.</td></tr>`}
    </tbody></table></div></div>`;
  document.getElementById("since").onchange = (e) => { linksSince = e.target.value; renderLinks(); };
  const clr = document.getElementById("clr"); if (clr) clr.onclick = () => { linksSince = ""; renderLinks(); };
  document.getElementById("cpL").onclick = async () => { await navigator.clipboard.writeText(rows.map(r => r.url).join("\n")); toast(`${rows.length} links copied`); };
  document.getElementById("cpT").onclick = async () => { await navigator.clipboard.writeText(tsv(true)); toast(`${rows.length} rows copied`); };
  document.getElementById("dl").onclick = () => {
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["creator", "tiktok_handle", "country", "video", "tiktok_link", "posted_at"].join(",")]
      .concat(rows.map(r => [r.creator, r.handle ? "@" + r.handle : "", r.country, r.video, r.url, r.posted_at].map(cell).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
    a.download = `tiktok-links-${(campaign.name || "").replace(/\W+/g, "-").toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  };
}

// ---------- review (grouped by creator; decisions are staged, then sent as one email per creator) ----------
let currentCid = null;   // creator currently open
let urlCache = {};       // version id -> signed video URL
const fbDrafts = {};     // version id -> feedback being typed (survives re-renders)

async function loadQueue(rerender) {
  if (!campaign) { queue = []; return; }
  const { data, error } = await sb.from("versions")
    .select("id, version_no, uploaded_at, file_name, size_bytes, storage_path, slot_id, decision, decision_feedback, decided_by, slots!inner(slot_no, creator_id, creators!inner(id, name, tiktok_handle, country, email, campaign_id))")
    .eq("review_status", "pending").eq("slots.creators.campaign_id", campaign.id)
    .order("uploaded_at").limit(2000);
  if (error) return toast(error.message);
  queue = data || [];
  if (currentCid && !queue.some(v => v.slots.creator_id === currentCid)) currentCid = null;
  if (rerender && tab === "review") renderShell();
}

function groups() {
  const m = new Map();
  for (const v of queue) {
    const c = v.slots.creators;
    if (!m.has(c.id)) m.set(c.id, { creator: c, items: [], oldest: v.uploaded_at });
    m.get(c.id).items.push(v);
  }
  const list = [...m.values()].map(g => {
    g.items.sort((a, b) => a.slots.slot_no - b.slots.slot_no);
    g.decided = g.items.filter(v => v.decision).length;
    g.ready = g.decided === g.items.length;
    return g;
  });
  // undecided creators first (oldest waiting first), ready-to-send at the bottom
  return list.sort((a, b) => (a.ready - b.ready) || a.oldest.localeCompare(b.oldest));
}

function renderReview() {
  const pane = document.getElementById("pane");
  const gs = groups();
  if (!gs.length) { pane.innerHTML = `<div class="card center muted" style="padding:48px">Nothing waiting for review 🎉</div>`; return; }
  const ready = gs.filter(g => g.ready);
  if (!currentCid || !gs.find(g => g.creator.id === currentCid)) currentCid = (gs.find(g => !g.ready) || gs[0]).creator.id;
  pane.innerHTML = `
    <div class="row spread" style="margin-bottom:12px">
      <span class="small muted">${gs.length} creator${gs.length === 1 ? "" : "s"} with drafts · ${gs.length - ready.length} still to decide · ${ready.length} ready to send</span>
      <button id="sendAll" ${ready.length ? "" : "disabled"}>Send all ready (${ready.length})</button>
    </div>
    <div class="review">
      <div class="card queue">${gs.map(g => `
        <button class="qi ${g.creator.id === currentCid ? "on" : ""}" data-cid="${g.creator.id}">
          <div class="row spread" style="flex-wrap:nowrap"><b>${esc(g.creator.name)}</b>
            ${g.ready ? `<span class="pill s-approved">Ready to send</span>` : g.decided ? `<span class="pill s-changes_requested">${g.decided}/${g.items.length} decided</span>` : `<span class="pill s-pending">${g.items.length} to review</span>`}</div>
          <span class="small muted">${g.items.map(v => `V${v.slots.slot_no}${v.version_no > 1 ? ` (v${v.version_no})` : ""}`).join(", ")} · ${esc(g.creator.country || "")} · waiting ${ago(g.oldest)}</span>
        </button>`).join("")}</div>
      <div class="card" id="detail"></div>
    </div>`;
  pane.querySelectorAll("[data-cid]").forEach(b => b.onclick = () => { currentCid = b.dataset.cid; renderReview(); });
  document.getElementById("sendAll").onclick = () => sendBatch(ready.map(g => g.creator.id), `Send one email to each of the ${ready.length} creator${ready.length === 1 ? "" : "s"} marked “Ready to send”?`);
  renderCreatorDetail(gs.find(g => g.creator.id === currentCid));
}

async function renderCreatorDetail(g) {
  const d = document.getElementById("detail");
  if (!g) { d.innerHTML = `<p class="muted">Pick a creator from the list.</p>`; return; }
  const c = g.creator;
  const handle = (c.tiktok_handle || "").replace(/^@/, "");
  // signed video URLs (1 hour) + earlier versions of these videos
  const need = g.items.filter(v => !urlCache[v.id]);
  const [signedRes, histRes] = await Promise.all([
    need.length ? sb.storage.from("drafts").createSignedUrls(need.map(v => v.storage_path), 3600) : Promise.resolve({ data: [] }),
    sb.from("versions").select("slot_id, version_no, uploaded_at, review_status, feedback, reviewed_by")
      .in("slot_id", g.items.map(v => v.slot_id)).neq("review_status", "pending").order("version_no"),
  ]);
  (signedRes.data || []).forEach((s, i) => { if (s?.signedUrl) urlCache[need[i].id] = s.signedUrl; });
  if (currentCid !== c.id) return;
  const hist = histRes.data || [];

  const card = (v) => {
    const url = urlCache[v.id];
    const earlier = hist.filter(h => h.slot_id === v.slot_id);
    const decided = v.decision
      ? `<div class="${v.decision === "approve" ? "note" : "feedback"}" style="${v.decision === "approve" ? "background:var(--ok-bg)" : ""}">
           <b>${v.decision === "approve" ? "✅ Approved" : "✏️ Changes requested"}</b>${v.decided_by ? ` <span class="small muted">· ${esc(v.decided_by)}</span>` : ""}
           ${v.decision_feedback ? `<div style="margin-top:6px;white-space:pre-wrap">${esc(v.decision_feedback)}</div>` : ""}
         </div>
         <div><button class="ghost sm" data-undo="${v.id}">Change decision</button></div>`
      : `<textarea data-fb="${v.id}" placeholder="Feedback for Video ${v.slots.slot_no} (required to request changes, optional when approving)">${esc(fbDrafts[v.id] || "")}</textarea>
         <div class="row"><button class="ok sm" data-approve="${v.id}">Approve</button><button class="bad sm" data-changes="${v.id}">Request changes</button></div>`;
    return `<section class="stack" style="border-top:1px solid var(--line);padding-top:14px">
      <div class="row spread"><div><b>Video ${v.slots.slot_no}</b> <span class="small muted">· version ${v.version_no}${v.version_no > 1 ? " (resubmission)" : ""} · uploaded ${fmt(v.uploaded_at)}</span></div>
        ${url ? `<a class="btn ghost sm" style="padding:6px 10px;font-size:13px" href="${url}&download=${encodeURIComponent(v.file_name || "draft.mp4")}">Download</a>` : ""}</div>
      ${url ? `<video src="${url}" controls playsinline preload="metadata"></video>` : `<div class="error small">Couldn't load this video.</div>`}
      ${earlier.length ? `<details><summary>Earlier versions (${earlier.length})</summary><ul class="hist">${earlier.map(h => `<li>v${h.version_no} · ${fmt(h.uploaded_at)} · <b>${h.review_status === "approved" ? "approved" : h.review_status === "skipped" ? "not needed" : "changes requested"}</b>${h.reviewed_by ? ` by ${esc(h.reviewed_by)}` : ""}${h.feedback ? `<br>${esc(h.feedback)}` : ""}</li>`).join("")}</ul></details>` : ""}
      ${decided}
    </section>`;
  };

  const undecided = g.items.length - g.decided;
  d.innerHTML = `<div class="stack">
    <div><h2 style="margin:0">${esc(c.name)}</h2>
      <div class="small muted">${esc(c.country || "")}${handle ? ` · <a href="https://www.tiktok.com/@${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a>` : ""} · ${esc(c.email || "no email on file")}</div></div>
    ${g.items.map(card).join("")}
    <div class="small muted">If a video doesn't play in your browser (some iPhone .mov files), use Download.</div>
    <div class="note stack" style="margin-top:6px">
      <div class="small">${g.decided ? `<b>${g.decided} of ${g.items.length}</b> decided.` : "Nothing decided yet."} Nothing reaches ${esc(c.name.split(" ")[0])} until you press Send: then all decisions go out together in <b>one email</b>.${undecided && g.decided ? ` ${undecided} undecided video${undecided === 1 ? "" : "s"} will stay in the queue.` : ""}</div>
      <div><button id="sendOne" ${g.decided ? "" : "disabled"}>Send ${g.decided ? `${g.decided} decision${g.decided === 1 ? "" : "s"} ` : ""}to ${esc(c.name.split(" ")[0])}</button></div>
    </div></div>`;

  d.querySelectorAll("[data-fb]").forEach(t => t.oninput = () => { fbDrafts[t.dataset.fb] = t.value; });
  d.querySelectorAll("[data-approve]").forEach(b => b.onclick = () => stage(b.dataset.approve, "approve"));
  d.querySelectorAll("[data-changes]").forEach(b => b.onclick = () => stage(b.dataset.changes, "changes"));
  d.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => stage(b.dataset.undo, null));
  document.getElementById("sendOne").onclick = () => sendBatch([c.id], undecided ? `Send ${g.decided} decision${g.decided === 1 ? "" : "s"} to ${c.name} now? ${undecided} undecided video${undecided === 1 ? "" : "s"} will stay in the queue.` : null);
  if (window.innerWidth < 860) d.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function stage(versionId, decision) {
  const v = queue.find(q => q.id === versionId); if (!v) return;
  const ta = document.querySelector(`[data-fb="${versionId}"]`);
  const feedback = decision === null ? "" : (ta?.value || "").trim();
  if (decision === "changes" && !feedback) { ta?.focus(); return toast("Write what should change first."); }
  try {
    await teamApi("decide", { version_id: versionId, decision, feedback });
    if (decision === null) { fbDrafts[versionId] = v.decision_feedback || ""; Object.assign(v, { decision: null, decision_feedback: null, decided_by: null }); }
    else { delete fbDrafts[versionId]; Object.assign(v, { decision, decision_feedback: feedback || null, decided_by: me.name }); }
    const g = groups().find(x => x.creator.id === currentCid);
    renderShell();
    if (g?.ready) toast(`All of ${g.creator.name}'s videos decided – press Send when you're ready.`, 3500);
  } catch (e) { toast(e.message, 5000); if (/already sent/.test(e.message)) loadQueue(true); }
}

async function sendBatch(creatorIds, confirmText) {
  if (!creatorIds.length) return;
  if (confirmText && !confirm(confirmText)) return;
  document.querySelectorAll("#sendAll, #sendOne").forEach(b => { b.disabled = true; b.textContent = "Sending…"; });
  try {
    const r = await teamApi("send", { creator_ids: creatorIds });
    const bits = [`${r.emailed} email${r.emailed === 1 ? "" : "s"} sent`];
    if (r.failed) bits.push(`${r.failed} failed (${r.error})`);
    if (r.no_email) bits.push(`${r.no_email} without an email address – decisions applied, tell them yourself`);
    toast(bits.join(" · "), r.failed || r.no_email ? 8000 : 3500);
    currentCid = null;
    await Promise.all([loadQueue(false), loadCreators()]);
    renderShell();
  } catch (e) { toast(e.message, 6000); renderShell(); }
}

// ---------- creators ----------
async function loadCreators() {
  if (!campaign) { creators = []; return; }
  const { data, error } = await sb.from("creators")
    .select("id, name, email, tiktok_handle, country, token, video_count, locked_at, invited_at, last_seen_at, slots(slot_no, status, tiktok_url, posted_at)")
    .eq("campaign_id", campaign?.id).order("name").limit(2000);
  if (error) return toast(error.message);
  creators = (data || []).map(c => ({ ...c, slots: (c.slots || []).sort((a, b) => a.slot_no - b.slot_no) }));
}

const linkFor = (c) => `${location.origin}${location.pathname.replace(/team\.html$/, "")}creator.html?t=${c.token}`;

function creatorStage(c) {
  if (!c.invited_at) return "not_invited";
  if (!c.last_seen_at) return "not_opened";
  if (!c.locked_at) return "not_committed";
  const st = c.slots.map(s => s.status);
  if (st.length && st.every(s => s === "posted")) return "complete";
  if (!draftsOn()) return "links_missing";
  if (st.includes("changes_requested")) return "changes";
  if (st.includes("approved")) return "awaiting_link";
  if (st.includes("pending")) return "in_review";
  return "uploading";
}
const STAGES_DRAFTS = { all: "All", not_invited: "Not invited", not_opened: "Invited, not opened", not_committed: "Opened, not committed", uploading: "Committed, no upload yet", in_review: "In review", changes: "Changes requested", awaiting_link: "Approved, link missing", complete: "All videos live" };
const STAGES_LINKS = { all: "All", not_invited: "Not invited", not_opened: "Invited, not opened", not_committed: "Opened, not committed", links_missing: "Committed, links missing", complete: "All videos live" };
let STAGES = STAGES_DRAFTS;

function renderCreators() {
  STAGES = draftsOn() ? STAGES_DRAFTS : STAGES_LINKS;
  if (!STAGES[filter.s]) filter.s = "all";
  const pane = document.getElementById("pane");
  const q = filter.q.toLowerCase();
  const rows = creators.filter(c => (filter.s === "all" || creatorStage(c) === filter.s) &&
    (!q || [c.name, c.email, c.tiktok_handle, c.country].some(x => (x || "").toLowerCase().includes(q))));
  const counts = {}; creators.forEach(c => { const s = creatorStage(c); counts[s] = (counts[s] || 0) + 1; });
  pane.innerHTML = `<div class="row" style="margin-bottom:12px">
      <input type="text" id="q" placeholder="Search name, email, handle, country" value="${esc(filter.q)}" style="max-width:320px">
      <select id="s" style="max-width:260px">${Object.entries(STAGES).map(([k, v]) => `<option value="${k}" ${filter.s === k ? "selected" : ""}>${v}${k === "all" ? ` (${creators.length})` : ` (${counts[k] || 0})`}</option>`).join("")}</select>
      <button class="ghost sm" id="csv">Export CSV</button>
    </div>
    <div class="card scroll-x" style="padding:6px 10px"><table><thead><tr><th>Creator</th><th>Country</th><th>Videos</th><th>Status</th><th>Last opened</th><th></th></tr></thead><tbody>
    ${rows.map(c => `<tr>
      <td><b>${esc(c.name)}</b><br><span class="small muted">${esc(c.email || "no email")}${c.tiktok_handle ? " · @" + esc(c.tiktok_handle.replace(/^@/, "")) : ""}</span></td>
      <td>${esc(c.country || "")}</td>
      <td>${c.locked_at ? c.video_count : c.video_count ? `<span class="muted">${c.video_count} (unlocked)</span>` : "—"}</td>
      <td><div class="chips">${c.slots.length ? c.slots.map(s => s.status === "posted" && s.tiktok_url
          ? `<a class="pill s-posted" href="${esc(s.tiktok_url)}" target="_blank" rel="noopener">V${s.slot_no} live ↗</a>`
          : draftsOn() ? `<span class="pill s-${s.status}">V${s.slot_no} ${LABEL[s.status]}</span>` : `<span class="pill s-empty">V${s.slot_no} link needed</span>`).join("")
        : `<span class="small muted">${STAGES[creatorStage(c)]}</span>`}</div></td>
      <td class="small muted">${c.last_seen_at ? fmt(c.last_seen_at) : c.invited_at ? "never" : "—"}</td>
      <td><div class="row" style="flex-wrap:nowrap">
        <button class="ghost sm" data-copy="${c.id}">Copy link</button>
        ${c.email ? `<button class="ghost sm" data-inv="${c.id}">${c.invited_at ? "Resend" : "Invite"}</button>` : ""}
        ${c.locked_at ? `<button class="ghost sm" data-unlock="${c.id}" title="Let them change their number of videos">Unlock</button>` : ""}
      </div></td></tr>`).join("") || `<tr><td colspan="6" class="muted center" style="padding:30px">No creators match.</td></tr>`}
    </tbody></table></div>`;
  const qi = document.getElementById("q");
  qi.oninput = () => { filter.q = qi.value; const pos = qi.selectionStart; renderCreators(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById("s").onchange = (e) => { filter.s = e.target.value; renderCreators(); };
  document.getElementById("csv").onclick = () => exportCsv(rows);
  pane.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { const c = creators.find(x => x.id === b.dataset.copy); await navigator.clipboard.writeText(linkFor(c)); toast("Link copied"); });
  pane.querySelectorAll("[data-inv]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await teamApi("invite", { creator_ids: [b.dataset.inv] }); toast(r.sent ? "Invite sent" : "Not sent: " + (r.error || "?"), r.sent ? 2500 : 6000); await loadCreators(); renderCreators(); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
  pane.querySelectorAll("[data-unlock]").forEach(b => b.onclick = async () => {
    if (!confirm("Let this creator choose their number of videos again? Videos already uploaded are kept.")) return;
    try { await teamApi("unlock", { creator_id: b.dataset.unlock }); toast("Unlocked"); await loadCreators(); renderCreators(); } catch (e) { toast(e.message); }
  });
}

function exportCsv(rows) {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["name", "email", "tiktok_handle", "country", "personal_link", "videos_committed", "stage", "video_1", "video_2", "video_3"];
  const lines = [head.join(",")].concat(rows.map(c => [c.name, c.email, c.tiktok_handle, c.country, linkFor(c), c.locked_at ? c.video_count : "", STAGES[creatorStage(c)],
    ...[1, 2, 3].map(n => { const s = c.slots.find(x => x.slot_no === n); return s ? (s.tiktok_url || LABEL[s.status]) : ""; })].map(cell).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
  a.download = `creators-${(campaign.name || "").replace(/\W+/g, "-").toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

// ---------- setup ----------
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === "," || ch === "\t" || ch === ";") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function mapRows(rows) {
  if (!rows.length) return [];
  const h = rows[0].map(x => x.trim().toLowerCase());
  const find = (...keys) => h.findIndex(x => keys.some(k => x.includes(k)));
  const iName = find("name"), iEmail = find("email", "mail"), iHandle = find("tiktok", "handle", "username"), iCountry = find("country", "market", "location");
  if (iName < 0 || iEmail < 0) throw new Error("The first row needs column names, including at least “name” and “email”.");
  return rows.slice(1).map(r => ({
    name: (r[iName] || "").trim(), email: (r[iEmail] || "").trim().toLowerCase(),
    tiktok_handle: iHandle >= 0 ? (r[iHandle] || "").trim().replace(/^@/, "") || null : null,
    country: iCountry >= 0 ? (r[iCountry] || "").trim() || null : null,
  })).filter(r => r.name && r.email);
}

async function renderSetup() {
  const pane = document.getElementById("pane");
  const notInvited = creators.filter(c => !c.invited_at && c.email).length;
  const { data: alerts } = await sb.from("alert_log").select("*").order("sent_at", { ascending: false }).limit(8);
  const { data: fails } = await sb.from("email_log").select("kind, recipient, error, sent_at").eq("ok", false).order("sent_at", { ascending: false }).limit(8);
  pane.innerHTML = `<div class="stack" style="max-width:760px">
    <section class="card stack"><h2>1 · Campaign: ${esc(campaign?.name)}</h2>
      <label class="small muted">Name (creators see this)</label><input type="text" id="cn" value="${esc(campaign?.name)}">
      <label class="small muted">Brief shown at the top of every creator's page (optional)</label><textarea id="cb" placeholder="E.g. song, deadline, do's and don'ts, hashtags…">${esc(campaign?.brief || "")}</textarea>
      <label class="row" style="gap:10px;align-items:flex-start;cursor:pointer;flex-wrap:nowrap">
        <input type="checkbox" id="cd" ${draftsOn() ? "checked" : ""} style="width:20px;height:20px;margin-top:2px;flex:none">
        <span><b>Drafts on</b><br><span class="small muted">On: creators upload drafts first; you approve or give feedback, and only approved videos can get a TikTok link.<br>Off: creators skip the drafts and paste their TikTok links straight away.</span></span>
      </label>
      <div><button id="cs">Save</button></div></section>

    <section class="card stack"><h2>2 · Import creators</h2>
      <p class="muted small" style="margin:0">Paste from a spreadsheet or upload a CSV. First row = column names. Needed: <b>name</b>, <b>email</b>. Optional: <b>tiktok</b> handle, <b>country</b>. They're added to <b>${esc(campaign.name)}</b>; emails already in this campaign are skipped.</p>
      <textarea id="imp" placeholder="name,email,tiktok,country&#10;Maria Santos,maria@example.com,@mariasantos,Philippines"></textarea>
      <div class="row"><input type="file" id="impf" accept=".csv,.tsv,.txt" class="small" style="max-width:260px;padding:6px"><button id="impb">Preview import</button></div>
      <div id="impr"></div></section>

    <section class="card stack"><h2>3 · Send invites</h2>
      <p class="muted small" style="margin:0">Each creator in ${esc(campaign.name)} gets an email with their personal link. ${creators.length} creators in this campaign, <b>${notInvited}</b> not invited yet.</p>
      <div class="row"><button id="invAll" ${notInvited ? "" : "disabled"}>Invite ${notInvited} creator${notInvited === 1 ? "" : "s"}</button><span class="small muted" id="invr"></span></div></section>

    <section class="card stack"><h2>Team alerts</h2>
      <p class="muted small" style="margin:0">Slack (#live-marketing-notifications) + email. Ivana: 05:00, 09:00, 13:00 · Anička: 09:00, 13:00, 17:00, 20:00 (Copenhagen time). Extra alert every time 20 more drafts are waiting, to whoever is on shift. Counts all campaigns with drafts on, split by market.</p>
      <div class="row"><button class="ghost" id="ta">Send test alert</button><span class="small muted" id="tar"></span></div>
      ${(alerts || []).length ? `<table><thead><tr><th>Sent</th><th>Type</th><th>Waiting</th><th>To</th><th>Result</th></tr></thead><tbody>${alerts.map(a => `<tr><td class="small">${fmt(a.sent_at)}</td><td class="small">${a.kind}</td><td>${a.pending ?? ""}</td><td class="small">${esc(a.recipients || "")}</td><td class="small">${a.ok ? "✓" : a.ok === false ? "✗ " + esc(a.detail || "") : "…"}${a.ok && a.detail ? " " + esc(a.detail) : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="small muted" style="margin:0">No alerts sent yet.</p>`}
    </section>

    ${(fails || []).length ? `<section class="card stack"><h2>Emails that failed</h2><table><tbody>${fails.map(f => `<tr><td class="small">${fmt(f.sent_at)}</td><td class="small">${esc(f.kind)}</td><td class="small">${esc(f.recipient)}</td><td class="small muted">${esc(f.error || "")}</td></tr>`).join("")}</tbody></table></section>` : ""}
  </div>`;

  document.getElementById("cs").onclick = async () => {
    const name = document.getElementById("cn").value.trim();
    const brief = document.getElementById("cb").value.trim() || null;
    const drafts_enabled = document.getElementById("cd").checked;
    if (!name) return toast("Give the campaign a name.");
    if (!drafts_enabled && draftsOn() && queue.length &&
      !confirm(`${queue.length} draft${queue.length === 1 ? " is" : "s are"} still waiting for review in ${campaign.name}. With drafts off they leave the review queue, and those creators can paste their TikTok links straight away. Continue?`)) return;
    const { error } = await sb.from("campaigns").update({ name, brief, drafts_enabled }).eq("id", campaign.id);
    if (error) return toast(error.message);
    Object.assign(campaign, { name, brief, drafts_enabled });
    toast("Saved"); renderShell();
  };
  document.getElementById("impf").onchange = async (e) => { const f = e.target.files[0]; if (f) document.getElementById("imp").value = await f.text(); };
  document.getElementById("impb").onclick = () => {
    const out = document.getElementById("impr");
    let list;
    try { list = mapRows(parseCsv(document.getElementById("imp").value)); } catch (e) { out.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
    const existing = new Set(creators.map(c => (c.email || "").toLowerCase()));
    const seen = new Set();
    const fresh = list.filter(r => { if (existing.has(r.email) || seen.has(r.email)) return false; seen.add(r.email); return true; });
    const bad = fresh.filter(r => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email));
    out.innerHTML = `<div class="note small">${list.length} rows read · <b>${fresh.length - bad.length}</b> new · ${list.length - fresh.length} already in the list${bad.length ? ` · ${bad.length} with an invalid email (skipped: ${bad.slice(0, 3).map(b => esc(b.email)).join(", ")}${bad.length > 3 ? "…" : ""})` : ""}</div>
      ${fresh.length - bad.length ? `<div class="row" style="margin-top:10px"><button id="impgo">Add ${fresh.length - bad.length} creators</button></div>` : ""}`;
    const go = document.getElementById("impgo");
    if (go) go.onclick = async () => {
      go.disabled = true; go.textContent = "Adding…";
      const rows = fresh.filter(r => !bad.includes(r)).map(r => ({ ...r, campaign_id: campaign.id }));
      for (let i = 0; i < rows.length; i += 200) {
        const { error } = await sb.from("creators").insert(rows.slice(i, i + 200));
        if (error) { out.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
      }
      toast(`${rows.length} creators added`); document.getElementById("imp").value = "";
      await loadCreators(); renderShell();
    };
  };
  document.getElementById("invAll").onclick = async (e) => {
    if (!confirm(`Send the invite email to ${notInvited} creators now?`)) return;
    e.target.disabled = true; document.getElementById("invr").textContent = "Sending…";
    try { const r = await teamApi("invite", { campaign_id: campaign.id }); document.getElementById("invr").textContent = `${r.sent} sent${r.failed ? `, ${r.failed} failed: ${r.error}` : ""}`; await loadCreators(); }
    catch (err) { document.getElementById("invr").textContent = err.message; e.target.disabled = false; }
  };
  document.getElementById("ta").onclick = async (e) => {
    e.target.disabled = true; document.getElementById("tar").textContent = "Sending…";
    try { const r = await teamApi("test_alert"); document.getElementById("tar").textContent = `Slack: ${r.slack.ok ? "✓" : "✗ " + r.slack.error} · Email: ${r.email.ok ? "✓" : "✗ " + r.email.error}`; }
    catch (err) { document.getElementById("tar").textContent = err.message; }
    e.target.disabled = false;
  };
}

boot();
</script>
