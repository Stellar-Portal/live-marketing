<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stellar Drafts</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .review { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  .queue { max-height: calc(100vh - 230px); overflow-y: auto; padding: 6px; position: sticky; top: 16px; }
  .qi { display: block; width: 100%; text-align: left; background: none; color: var(--ink); border: none; border-radius: 8px; padding: 10px 12px; font-weight: 400; }
  .qi + .qi { margin-top: 2px; }
  .qi:hover { background: var(--pearl); }
  .qi.on { background: var(--accent-soft); }
  .qi b { font-weight: 600; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .login { max-width: 420px; margin: 12vh auto 0; }
  /* Stellar OS shell: black sidebar, white logo, cobalt only on the active section */
  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; width: 232px; display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 18px; background: #000; color: #fff; overflow-y: auto; }
  .content { margin-left: 232px; min-height: 100vh; }
  .content main { max-width: 1240px; margin: 0 auto; padding: 32px 32px 56px; }
  .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px; }
  .sidebar .brand img { height: 18px; width: auto; display: block; }
  .sidebar .brand span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.02em; }
  .nav { display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.4); padding: 0 10px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; color: rgba(255,255,255,0.74); font-size: 14px; white-space: nowrap; text-align: left; transition: background 0.15s, color 0.15s; }
  .nav-item:hover { background: rgba(255,255,255,0.08); border: none; color: #fff; }
  .nav-item:active { transform: none; }
  .nav-item.on { background: rgba(255,255,255,0.12); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #8aa0ff; }
  .nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item em { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; background: #8aa0ff; flex: none; }
  .nav-item .dot.off { background: rgba(255,255,255,0.35); }
  .nav-item.add { color: rgba(255,255,255,0.5); font-size: 13px; }
  .who { font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: rgba(255,255,255,0.6); padding: 12px 10px 0; border-top: 1px solid rgba(255,255,255,0.12); }
  .who button { font-size: 12px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 5px 12px; }
  .who button:hover { background: transparent; border-color: #fff; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  @media (max-width: 860px) {
    .sidebar { position: static; width: auto; gap: 14px; padding: 14px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 14px; }
    .nav-group { flex-direction: row; align-items: center; }
    .nav-label { display: none; }
    .content { margin-left: 0; }
    .content main { padding: 20px 16px 48px; }
  }
  /* review: compact video rows */
  .vrow { display: grid; grid-template-columns: 120px 1fr; gap: 20px; padding: 18px 0; border-top: 1px solid var(--divider); }
  .vrow video, .vrow .novid { width: 120px; aspect-ratio: 9 / 16; object-fit: contain; background: var(--tile); border-radius: var(--r-md); display: block; }
  .vrow .novid { display: grid; place-items: center; color: #9aa3b2; font-size: 12px; text-align: center; padding: 8px; }
  .vinfo { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .vinfo textarea { min-height: 72px; }
  .decision { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .decision.ok { background: var(--good-tint); color: #0f4d22; }
  .decision.ch { background: var(--warn-bg); color: #4a3104; }
  .sendbar { position: sticky; bottom: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--hairline); margin: 0 -24px -24px; padding: 14px 24px; border-radius: 0 0 var(--radius) var(--radius); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .sendbar > span { flex: 1; min-width: 0; }
  .sendbar button { flex: none; }
  @media (max-width: 860px) { .review { grid-template-columns: 1fr; } .queue { max-height: 260px; position: static; } }
  @media (max-width: 520px) { .vrow { grid-template-columns: 96px 1fr; gap: 12px; } .vrow video, .vrow .novid { width: 96px; } }
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:32px">Loading…</p></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient(SLM.SUPABASE_URL, SLM.KEY);
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
const LABEL = { empty: "Not uploaded", pending: "To review", changes_requested: "Changes req.", approved: "Approved", posted: "Live" };
function toast(msg, ms = 3000) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

let me = null, campaign = null, campaigns = [], tab = "review", queue = [], creators = [], filter = { q: "", s: "all" };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const draftsOn = () => campaign?.drafts_enabled !== false;

async function loadCampaigns() {
  const { data, error } = await sb.from("campaigns").select("*").eq("active", true).order("sort_order").order("created_at");
  if (error) return toast(error.message);
  campaigns = data || [];
  const saved = store.get("slm:campaign");
  campaign = campaigns.find(c => c.id === (campaign?.id || saved)) || campaigns[0] || null;
  if (campaign) store.set("slm:campaign", campaign.id);
}

async function switchCampaign(id) {
  campaign = campaigns.find(c => c.id === id) || campaign;
  store.set("slm:campaign", campaign.id);
  currentCid = null; urlCache = {}; filter = { q: "", s: "all" }; linksSince = "";
  if (!draftsOn() && tab === "review") tab = "links";
  app.querySelector("#pane") && (app.querySelector("#pane").innerHTML = `<p class="muted">Loading ${esc(campaign.name)}…</p>`);
  await refreshAll();
}

async function teamApi(action, extra = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${SLM.SUPABASE_URL}/functions/v1/team-api`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SLM.KEY, Authorization: `Bearer ${session?.access_token}` },
    body: JSON.stringify({ action, ...extra }),
  });
  const data = await r.json().catch(() => ({ error: "Connection problem" }));
  if (!r.ok || data.error) throw new Error(data.error || "Something went wrong");
  return data;
}

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: tm } = await sb.from("team_members").select("email, name");
  me = (tm || []).find(m => m.email.toLowerCase() === session.user.email.toLowerCase());
  if (!me) {
    app.innerHTML = `<div class="card stack login"><h1 style="font-size:32px">No access</h1><p class="muted">${esc(session.user.email)} isn't on the review team list. Ask Sam to add you.</p><button class="ghost" id="out">Sign out</button></div>`;
    document.getElementById("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  await loadCampaigns();
  if (!draftsOn()) tab = "links";
  await refreshAll();
  // refresh the queue every minute, but never while someone is typing feedback
  setInterval(() => {
    const typing = document.activeElement?.tagName === "TEXTAREA" || Object.values(fbDrafts).some(x => x && x.trim());
    if (tab === "review" && !typing) loadQueue(true);
  }, 60000);
}

function showLogin() {
  app.innerHTML = `<div class="card stack login">
    <img src="assets/stellar-blue.png" alt="Stellar" style="height:22px;display:block;margin-bottom:8px"><h1 style="font-size:32px">Sign in to Drafts</h1>
    <p class="muted" style="margin:0">Enter your Stellar email and we'll send you a sign-in code.</p>
    <form id="lf" class="stack"><input type="email" id="em" placeholder="you@stellarmusic.dk" required autocomplete="email"><button style="width:100%;justify-content:center">Send code</button></form>
    <form id="cf" class="stack hidden"><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from the email" maxlength="12" required><button style="width:100%;justify-content:center">Sign in</button></form>
    <div id="lm"></div></div>`;
  let email = "";
  const msg = (h) => document.getElementById("lm").innerHTML = h;
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault();
    email = document.getElementById("em").value.trim().toLowerCase();
    const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Sending…";
    try {
      const r = await fetch(`${SLM.SUPABASE_URL}/functions/v1/team-login`, {
        method: "POST", headers: { "Content-Type": "application/json", apikey: SLM.KEY }, body: JSON.stringify({ email }),
      });
      const d = await r.json().catch(() => ({ error: "Connection problem" }));
      if (!r.ok || d.error) throw new Error(d.error || "Something went wrong");
      document.getElementById("lf").classList.add("hidden");
      document.getElementById("cf").classList.remove("hidden");
      document.getElementById("code").focus();
      msg(`<div class="note small">Code sent to <b>${esc(email)}</b>. Check your inbox (and spam, the first time).</div>`);
    } catch (err) { msg(`<div class="error">${esc(err.message)}</div>`); b.disabled = false; b.textContent = "Send code"; }
  };
  document.getElementById("cf").onsubmit = async (e) => {
    e.preventDefault();
    const token = document.getElementById("code").value.replace(/\D/g, "");
    let { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
    if (error) ({ error } = await sb.auth.verifyOtp({ email, token, type: "magiclink" }));
    if (error) return msg(`<div class="error">That code didn't work. Check it, or go back and request a new one.</div>`);
    boot();
  };
}

// ---------- shell ----------
async function refreshAll() { await Promise.all([loadQueue(false), loadCreators()]); renderShell(); }

function stats() {
  const slots = creators.flatMap(c => c.slots || []);
  return {
    creators: creators.length,
    invited: creators.filter(c => c.invited_at).length,
    locked: creators.filter(c => c.locked_at).length,
    committed: slots.length,
    pending: queue.filter(v => !v.decision).length,
    approved: slots.filter(s => ["approved", "posted"].includes(s.status)).length,
    live: slots.filter(s => s.status === "posted").length,
  };
}

function renderShell() {
  const s = stats();
  const on = draftsOn();
  if (!on && tab === "review") tab = "links";
  const TABS = [
    on ? ["review", "Review queue", s.pending] : null,
    ["links", "Posted links", s.live],
    ["creators", "Creators", s.creators],
    ["setup", "Setup", null],
  ].filter(Boolean);
  const ICON = { review: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 9l5 2.5-5 2.5z"/></svg>`, links: `<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>`, creators: `<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/></svg>`, setup: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>` };
  const title = (TABS.find(t => t[0] === tab) || TABS[0])[1];
  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand"><img src="assets/stellar-white.png" alt="Stellar"><span>Drafts</span></div>
      <nav class="nav">
        <div class="nav-group">
          <div class="nav-label">Campaigns</div>
          ${campaigns.map(c => `<button class="nav-item ${c.id === campaign?.id ? "on" : ""}" data-camp="${c.id}"><span class="dot ${c.drafts_enabled === false ? "off" : ""}"></span>${esc(c.name)}<em>${c.drafts_enabled === false ? "Links" : "Drafts"}</em></button>`).join("")}
          <button class="nav-item add" id="newCamp">+ New campaign</button>
        </div>
        ${campaign ? `<div class="nav-group">
          <div class="nav-label">${esc(campaign.name)}</div>
          ${TABS.map(([k, label, n]) => `<button class="nav-item ${tab === k ? "on" : ""}" data-tab="${k}">${ICON[k]}${label}${n != null ? `<em>${n}</em>` : ""}</button>`).join("")}
        </div>` : ""}
      </nav>
      <div class="who"><span>${esc(me.name)}</span><button id="out">Sign out</button></div>
    </aside>
    <div class="content"><main>
      ${campaign ? `
      <div class="page-head">
        <div><div class="muted small">${esc(campaign.name)}, ${on ? "drafts on" : "links only"}</div><h1>${title}</h1></div>
      </div>
      <div class="stats" style="margin-bottom:28px">
        ${on ? `<div class="stat"><b>${s.pending}</b><span>Waiting for review</span></div>` : ""}
        <div class="stat"><b>${s.locked}/${s.creators}</b><span>Creators committed</span></div>
        <div class="stat"><b>${s.committed}</b><span>Videos committed</span></div>
        ${on ? `<div class="stat"><b>${s.approved}</b><span>Approved</span></div>` : ""}
        <div class="stat"><b>${s.live}</b><span>Videos live</span></div>
      </div>
      <div id="pane"></div>` : `<div class="card muted">No campaigns yet. Click “+ New campaign”.</div>`}
    </main></div>`;
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  app.querySelectorAll("[data-camp]").forEach(b => b.onclick = () => { if (b.dataset.camp !== campaign?.id) switchCampaign(b.dataset.camp); });
  document.getElementById("newCamp").onclick = async () => {
    const name = prompt("Name of the new campaign (creators will see this name):");
    if (!name || !name.trim()) return;
    const { data, error } = await sb.from("campaigns").insert({ name: name.trim(), sort_order: campaigns.length + 1 }).select().single();
    if (error) return toast(error.message);
    campaigns.push(data); tab = "setup"; await switchCampaign(data.id);
  };
  if (!campaign) return;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderShell(); });
  if (tab === "review") renderReview(); else if (tab === "links") renderLinks(); else if (tab === "creators") renderCreators(); else renderSetup();
}

// ---------- posted links (for copying into the external dashboard) ----------
let linksSince = "";
function postedLinks() {
  return creators.flatMap(c => c.slots.filter(s => s.status === "posted" && (s.tiktok_url || s.instagram_url)).map(s => ({
    creator: c.name, handle: (c.tiktok_handle || "").replace(/^@/, ""), country: c.country || "",
    video: s.slot_no, tt: s.tiktok_url || "", ig: s.instagram_url || "", posted_at: s.posted_at,
    changed_at: s.links_updated_at || s.posted_at,
  }))).sort((a, b) => (a.posted_at || "").localeCompare(b.posted_at || ""));
}

function renderLinks() {
  const pane = document.getElementById("pane");
  const all = postedLinks();
  // "since" also catches links added or changed later (e.g. an Instagram link added after the TikTok one)
  const rows = linksSince ? all.filter(r => r.changed_at && r.changed_at >= new Date(linksSince + "T00:00:00").toISOString()) : all;
  const nLinks = rows.reduce((n, r) => n + (r.tt ? 1 : 0) + (r.ig ? 1 : 0), 0);
  const tsv = (withHead) => (withHead ? ["Creator", "TikTok handle", "Country", "Video", "TikTok link", "Instagram link", "Posted"].join("\t") + "\n" : "") +
    rows.map(r => [r.creator, r.handle ? "@" + r.handle : "", r.country, r.video, r.tt, r.ig, r.posted_at ? r.posted_at.slice(0, 10) : ""].join("\t")).join("\n");
  pane.innerHTML = `<div class="stack">
    <div class="row">
      <label class="small muted">Posted since</label>
      <input type="date" id="since" value="${linksSince}" style="max-width:180px">
      ${linksSince ? `<button class="ghost sm" id="clr">Show all</button>` : ""}
      <span class="small muted">${rows.length} video${rows.length === 1 ? "" : "s"}, ${nLinks} link${nLinks === 1 ? "" : "s"}</span>
    </div>
    <div class="row">
      <button id="cpL" ${rows.length ? "" : "disabled"}>Copy links only</button>
      <button class="ghost" id="cpT" ${rows.length ? "" : "disabled"}>Copy as table</button>
      <button class="ghost" id="dl" ${rows.length ? "" : "disabled"}>Download CSV</button>
    </div>
    <p class="small muted" style="margin:0">“Copy links only” gives every link (TikTok and Instagram) one per line. “Copy as table” pastes straight into Google Sheets or Excel with all columns.</p>
    <div class="card scroll-x" style="padding:6px 10px"><table><thead><tr><th>Creator</th><th>Country</th><th>Video</th><th>TikTok</th><th>Instagram</th><th>Posted</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r => `<tr><td><b>${esc(r.creator)}</b>${r.handle ? `<br><span class="small muted">@${esc(r.handle)}</span>` : ""}</td><td>${esc(r.country)}</td><td>${r.video}</td>
        <td class="small">${r.tt ? `<a href="${esc(r.tt)}" target="_blank" rel="noopener">${esc(r.tt)}</a>` : `<span class="muted">—</span>`}</td>
        <td class="small">${r.ig ? `<a href="${esc(r.ig)}" target="_blank" rel="noopener">${esc(r.ig)}</a>` : `<span class="muted">—</span>`}</td><td class="small muted">${fmt(r.posted_at)}</td></tr>`).join("")
        || `<tr><td colspan="6" class="muted center" style="padding:30px">No links yet.</td></tr>`}
    </tbody></table></div></div>`;
  document.getElementById("since").onchange = (e) => { linksSince = e.target.value; renderLinks(); };
  const clr = document.getElementById("clr"); if (clr) clr.onclick = () => { linksSince = ""; renderLinks(); };
  document.getElementById("cpL").onclick = async () => { await navigator.clipboard.writeText(rows.flatMap(r => [r.tt, r.ig].filter(Boolean)).join("\n")); toast(`${nLinks} links copied`); };
  document.getElementById("cpT").onclick = async () => { await navigator.clipboard.writeText(tsv(true)); toast(`${rows.length} rows copied`); };
  document.getElementById("dl").onclick = () => {
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["creator", "tiktok_handle", "country", "video", "tiktok_link", "instagram_link", "posted_at"].join(",")]
      .concat(rows.map(r => [r.creator, r.handle ? "@" + r.handle : "", r.country, r.video, r.tt, r.ig, r.posted_at].map(cell).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
    a.download = `video-links-${(campaign.name || "").replace(/\W+/g, "-").toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  };
}

// ---------- review (grouped by creator; decisions are staged, then sent as one email per creator) ----------
let currentCid = null;   // creator currently open
let urlCache = {};       // version id -> signed video URL
const thumbPublic = (p) => `${SLM.SUPABASE_URL}/storage/v1/object/public/thumbs/${p}`;
const fbDrafts = {};     // version id -> feedback being typed (survives re-renders)

async function loadQueue(rerender) {
  if (!campaign) { queue = []; return; }
  const { data, error } = await sb.from("versions")
    .select("id, version_no, uploaded_at, file_name, size_bytes, storage_path, thumb_path, slot_id, decision, decision_feedback, decided_by, slots!inner(slot_no, creator_id, creators!inner(id, name, tiktok_handle, country, email, campaign_id))")
    .eq("review_status", "pending").eq("slots.creators.campaign_id", campaign.id)
    .order("uploaded_at").limit(2000);
  if (error) return toast(error.message);
  queue = data || [];
  if (currentCid && !queue.some(v => v.slots.creator_id === currentCid)) currentCid = null;
  if (rerender && tab === "review") renderShell();
}

function groups() {
  const m = new Map();
  for (const v of queue) {
    const c = v.slots.creators;
    if (!m.has(c.id)) m.set(c.id, { creator: c, items: [], oldest: v.uploaded_at });
    m.get(c.id).items.push(v);
  }
  const list = [...m.values()].map(g => {
    g.items.sort((a, b) => a.slots.slot_no - b.slots.slot_no);
    g.decided = g.items.filter(v => v.decision).length;
    g.ready = g.decided === g.items.length;
    return g;
  });
  // undecided creators first (oldest waiting first), ready-to-send at the bottom
  return list.sort((a, b) => (a.ready - b.ready) || a.oldest.localeCompare(b.oldest));
}

async function stage(versionId, decision) {
  const v = queue.find(q => q.id === versionId); if (!v) return;
  const ta = document.querySelector(`[data-fb="${versionId}"]`);
  const feedback = decision === null ? "" : (ta?.value || "").trim();
  if (decision === "changes" && !feedback) { ta?.focus(); return toast("Write what should change first."); }
  try {
    await teamApi("decide", { version_id: versionId, decision, feedback });
    if (decision === null) { fbDrafts[versionId] = v.decision_feedback || ""; Object.assign(v, { decision: null, decision_feedback: null, decided_by: null }); }
    else { delete fbDrafts[versionId]; Object.assign(v, { decision, decision_feedback: feedback || null, decided_by: me.name }); }
    const g = groups().find(x => x.creator.id === currentCid);
    renderShell();
    if (g?.ready) toast(`All of ${g.creator.name}'s videos decided – press Send when you're ready.`, 3500);
  } catch (e) { toast(e.message, 5000); if (/already sent/.test(e.message)) loadQueue(true); }
}

async function sendBatch(creatorIds, confirmText) {
  if (!creatorIds.length) return;
  if (confirmText && !confirm(confirmText)) return;
  document.querySelectorAll("#sendAll, #sendOne").forEach(b => { b.disabled = true; b.textContent = "Sending…"; });
  try {
    const r = await teamApi("send", { creator_ids: creatorIds });
    const bits = [`${r.emailed} email${r.emailed === 1 ? "" : "s"} sent`];
    if (r.failed) bits.push(`${r.failed} failed (${r.error})`);
    if (r.no_email) bits.push(`${r.no_email} without an email address – decisions applied, tell them yourself`);
    toast(bits.join(" · "), r.failed || r.no_email ? 8000 : 3500);
    currentCid = null;
    await Promise.all([loadQueue(false), loadCreators()]);
    renderShell();
  } catch (e) { toast(e.message, 6000); renderShell(); }
}

  if (!c.invited_at) return "not_invited";
  if (!c.last_seen_at) return "not_opened";
  if (!c.locked_at) return "not_committed";
  const st = c.slots.map(s => s.status);

  if (st.includes("approved")) return "awaiting_link";

function exportCsv(rows) {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["name", "email", "tiktok_handle", "country", "personal_link", "videos_committed", "stage", "video_1", "video_2", "video_3"];
  const lines = [head.join(",")].concat(rows.map(c => [c.name, c.email, c.tiktok_handle, c.country, linkFor(c), c.locked_at ? c.video_count : "", STAGES[creatorStage(c)],
    ...[1, 2, 3].map(n => { const s = c.slots.find(x => x.slot_no === n); return s ? ([s.tiktok_url, s.instagram_url].filter(Boolean).join(" ") || LABEL[s.status]) : ""; })].map(cell).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
  a.download = `creators-${(campaign.name || "").replace(/\W+/g, "-").toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

// ---------- setup ----------
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === "," || ch === "\t" || ch === ";") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function mapRows(rows) {
  if (!rows.length) return [];
  const h = rows[0].map(x => x.trim().toLowerCase());
  const find = (...keys) => h.findIndex(x => keys.some(k => x.includes(k)));
  const iName = find("name"), iEmail = find("email", "mail"), iHandle = find("tiktok", "handle", "username"), iCountry = find("country", "market", "location");
  if (iName < 0 || iEmail < 0) throw new Error("The first row needs column names, including at least “name” and “email”.");
  return rows.slice(1).map(r => ({
    name: (r[iName] || "").trim(), email: (r[iEmail] || "").trim().toLowerCase(),
    tiktok_handle: iHandle >= 0 ? (r[iHandle] || "").trim().replace(/^@/, "") || null : null,
    country: iCountry >= 0 ? (r[iCountry] || "").trim() || null : null,
  })).filter(r => r.name && r.email);
}

      <p class="muted small" style="margin:0">Slack (#live-marketing-notifications) + email. Ivana &amp; Ming: 05:00, 09:00, 13:00 · Anička: 09:00, 13:00, 17:00, 20:00 (Copenhagen time). Extra alert every time 20 more drafts are waiting, to whoever is on shift. Counts all campaigns with drafts on, split by market.</p>
      <div class="row"><button class="ghost" id="ta">Send test alert</button><span class="small muted" id="tar"></span></div>
      ${(alerts || []).length ? `<table><thead><tr><th>Sent</th><th>Type</th><th>Waiting</th><th>To</th><th>Result</th></tr></thead><tbody>${alerts.map(a => `<tr><td class="small">${fmt(a.sent_at)}</td><td class="small">${a.kind}</td><td>${a.pending ?? ""}</td><td class="small">${esc(a.recipients || "")}</td><td class="small">${a.ok ? "✓" : a.ok === false ? "✗ " + esc(a.detail || "") : "…"}${a.ok && a.detail ? " " + esc(a.detail) : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="small muted" style="margin:0">No alerts sent yet.</p>`}
    </section>

    ${(fails || []).length ? `<section class="card stack"><h2>Emails that failed</h2><table><tbody>${fails.map(f => `<tr><td class="small">${fmt(f.sent_at)}</td><td class="small">${esc(f.kind)}</td><td class="small">${esc(f.recipient)}</td><td class="small muted">${esc(f.error || "")}</td></tr>`).join("")}</tbody></table></section>` : ""}
  </div>`;

  document.getElementById("cs").onclick = async () => {
    const name = document.getElementById("cn").value.trim();
    const brief = document.getElementById("cb").value.trim() || null;
    const drafts_enabled = document.getElementById("cd").checked;
    if (!name) return toast("Give the campaign a name.");
    if (!drafts_enabled && draftsOn() && queue.length &&
      !confirm(`${queue.length} draft${queue.length === 1 ? " is" : "s are"} still waiting for review in ${campaign.name}. With drafts off they leave the review queue, and those creators can paste their video links straight away. Continue?`)) return;
    const { error } = await sb.from("campaigns").update({ name, brief, drafts_enabled }).eq("id", campaign.id);
    if (error) return toast(error.message);
    Object.assign(campaign, { name, brief, drafts_enabled });
    toast("Saved"); renderShell();
  };
  document.getElementById("rem").onchange = async (e) => {
    const on = e.target.checked;
    if (on && !confirm(`Start reminders for ${campaign.name}? The first ones go out within the hour (during ${campaign.name} daytime).`)) { e.target.checked = false; return; }
    const { error } = await sb.from("campaigns").update({ reminders_enabled: on }).eq("id", campaign.id);
    if (error) { e.target.checked = !on; return toast(error.message); }
    campaign.reminders_enabled = on; toast(on ? "Reminders on" : "Reminders off");
  };
  document.getElementById("remPrev").onclick = async (e) => {
    const out = document.getElementById("remr"); e.target.disabled = true; out.textContent = "Checking…";
    try {
      const r = await teamApi("reminder_preview", { campaign_id: campaign.id });
      const x = (r.report || [])[0] || {};
      const parts = [x.post && `${x.post} approved video${x.post === 1 ? "" : "s"} to post`, x.upload && `${x.upload} draft${x.upload === 1 ? "" : "s"} not uploaded`,
        x.fix && `${x.fix} to fix`, x.commit && `${x.commit} haven't chosen 2 or 3 yet`, x.link && `${x.link} link${x.link === 1 ? "" : "s"} missing`].filter(Boolean);
      out.innerHTML = `<b>${x.creators || 0} creator${x.creators === 1 ? "" : "s"}</b>${parts.length ? ": " + parts.join(", ") : ""}`;
    } catch (err) { out.textContent = err.message; }
    e.target.disabled = false;
  };
  document.getElementById("impf").onchange = async (e) => { const f = e.target.files[0]; if (f) document.getElementById("imp").value = await f.text(); };
  document.getElementById("impb").onclick = () => {
    const out = document.getElementById("impr");
    let list;
    try { list = mapRows(parseCsv(document.getElementById("imp").value)); } catch (e) { out.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
    const existing = new Set(creators.map(c => (c.email || "").toLowerCase()));
    const seen = new Set();
    const fresh = list.filter(r => { if (existing.has(r.email) || seen.has(r.email)) return false; seen.add(r.email); return true; });
    const bad = fresh.filter(r => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email));
    out.innerHTML = `<div class="note small">${list.length} rows read · <b>${fresh.length - bad.length}</b> new · ${list.length - fresh.length} already in the list${bad.length ? ` · ${bad.length} with an invalid email (skipped: ${bad.slice(0, 3).map(b => esc(b.email)).join(", ")}${bad.length > 3 ? "…" : ""})` : ""}</div>
      ${fresh.length - bad.length ? `<div class="row" style="margin-top:10px"><button id="impgo">Add ${fresh.length - bad.length} creators</button></div>` : ""}`;
    const go = document.getElementById("impgo");
    if (go) go.onclick = async () => {
      go.disabled = true; go.textContent = "Adding…";
      const rows = fresh.filter(r => !bad.includes(r)).map(r => ({ ...r, campaign_id: campaign.id }));
      for (let i = 0; i < rows.length; i += 200) {
        const { error } = await sb.from("creators").insert(rows.slice(i, i + 200));
        if (error) { out.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
      }
      toast(`${rows.length} creators added`); document.getElementById("imp").value = "";
      await loadCreators(); renderShell();
    };
  };
  document.getElementById("invAll").onclick = async (e) => {
    if (!confirm(`Send the invite email to ${notInvited} creators now?`)) return;
    e.target.disabled = true; document.getElementById("invr").textContent = "Sending…";
    try { const r = await teamApi("invite", { campaign_id: campaign.id }); document.getElementById("invr").textContent = `${r.sent} sent${r.failed ? `, ${r.failed} failed: ${r.error}` : ""}`; await loadCreators(); }
    catch (err) { document.getElementById("invr").textContent = err.message; e.target.disabled = false; }
  };
  document.getElementById("ta").onclick = async (e) => {
    e.target.disabled = true; document.getElementById("tar").textContent = "Sending…";
    try { const r = await teamApi("test_alert"); document.getElementById("tar").textContent = `Slack: ${r.slack.ok ? "✓" : "✗ " + r.slack.error} · Email: ${r.email.ok ? "✓" : "✗ " + r.email.error}`; }
    catch (err) { document.getElementById("tar").textContent = err.message; }
    e.target.disabled = false;
  };
}

boot();
</script>
</body>
</html>
