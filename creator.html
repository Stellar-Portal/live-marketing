<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stellar</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  /* Apple-style global bar: thin, black, white Stellar logo */
  .gnav { background: #000; height: 48px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 20; }
  .gnav img { height: 17px; display: block; }
  .top { padding: 36px 0 24px; }
  .top h1 { margin-bottom: 6px; }
  .brief { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 16px 20px; white-space: pre-wrap; font-size: 15px; margin-bottom: 16px; }
  .stats.mini { margin-bottom: 16px; }
  .stats.mini .stat { padding: 14px 18px; }
  .stats.mini .stat b { font-size: 22px; }
  .slots > * + * { margin-top: 12px; }
  .slot { display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; }
  .slot-head { display: flex; align-items: center; gap: 14px; }
  .slot-thumb { width: 44px; height: 78px; object-fit: cover; border-radius: var(--r-sm); flex: none; background: var(--tile); }
  .slot-thumb.empty { background: var(--parchment); color: var(--muted); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 18px; }
  .slot-title { flex: 1; min-width: 0; }
  .slot-title .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script>
</head>
<body>
<header class="gnav"><img src="assets/stellar-white.png" alt="Stellar"></header>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script>
const T = new URLSearchParams(location.search).get("t") || "";
const app = document.getElementById("app");
let state = null;
let uploading = {}; // slot_no -> { upload, pct }

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const mb = (b) => b ? (b / 1048576).toFixed(b > 104857600 ? 0 : 1) + " MB" : "";

function toast(msg, ms = 3500) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), ms);
}

async function api(action, extra = {}) {
  const r = await fetch(`${SLM.SUPABASE_URL}/functions/v1/creator-api`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SLM.KEY },
    body: JSON.stringify({ token: T, action, ...extra }),
  });
  const data = await r.json().catch(() => ({ error: "Connection problem, please try again." }));
  if (!r.ok || data.error) throw new Error(data.error || "Something went wrong.");
  return data;
}

async function load() {
  try {
    state = await api("get");
    render();
  } catch (e) {
    app.innerHTML = `<div class="eyebrow">Stellar</div><h1>We couldn't open this page</h1><div class="error">${esc(e.message)}</div><p class="muted small">Check that you opened the full link from your email. If it still doesn't work, reply to that email and we'll help.</p>`;
  }
}

const STATUS_LABEL = {
  empty: "Not uploaded", pending: "Waiting for review", changes_requested: "Changes requested",
  approved: "Approved", posted: "Live on TikTok",
};

function render() {
  const { creator, campaign, slots } = state;
  const first = esc((creator.name || "").split(" ")[0]);
  let html = `<header class="top">
      <h1>Hi ${first}</h1>
      <p class="muted" style="margin:0;font-size:17px">Your page for the ${esc(campaign.name)} campaign.</p>
    </header>`;
  if (campaign.brief) html += `<div class="brief">${esc(campaign.brief)}</div>`;

  if (!creator.locked) {
    html += `<div class="card stack">
      <div><h2>How many videos will you make?</h2>
      <p class="muted small" style="margin:4px 0 0">Choose 2 or 3. Once you confirm, the number is locked and you'll ${campaign.drafts_enabled ? "upload exactly that many drafts" : "send exactly that many TikTok links"}.</p></div>
      <div class="choice" style="grid-template-columns:repeat(2,1fr)">
        ${[2,3].map(n => `<button type="button" data-n="${n}">${n}<span>videos</span></button>`).join("")}
      </div>
      <button id="lockBtn" disabled style="width:100%;justify-content:center">Confirm</button>
      <div id="lockErr"></div>
    </div>`;
    app.innerHTML = html;
    let chosen = 0;
    app.querySelectorAll(".choice button").forEach(b => b.onclick = () => {
      chosen = Number(b.dataset.n);
      app.querySelectorAll(".choice button").forEach(x => x.classList.toggle("sel", x === b));
      const lb = document.getElementById("lockBtn");
      lb.disabled = false; lb.textContent = `Lock in ${chosen} video${chosen > 1 ? "s" : ""}`;
    });
    document.getElementById("lockBtn").onclick = async () => {
      if (!chosen) return;
      if (!confirm(`You're committing to ${chosen} video${chosen > 1 ? "s" : ""}. You can't change this yourself afterwards. Continue?`)) return;
      const lb = document.getElementById("lockBtn"); lb.disabled = true; lb.textContent = "Saving…";
      try { await api("lock", { count: chosen }); await load(); }
      catch (e) { document.getElementById("lockErr").innerHTML = `<div class="error">${esc(e.message)}</div>`; lb.disabled = false; lb.textContent = `Lock in ${chosen}`; }
    };
    return;
  }

  const live = slots.filter(s => s.status === "posted").length;
  const approved = slots.filter(s => ["approved","posted"].includes(s.status)).length;
  html += `<div class="stats mini" style="grid-template-columns:repeat(${campaign.drafts_enabled ? 3 : 2},1fr)">
      <div class="stat"><b>${creator.video_count}</b><span>Committed</span></div>
      ${campaign.drafts_enabled ? `<div class="stat"><b>${approved}</b><span>Approved</span></div>` : ""}
      <div class="stat"><b>${live}</b><span>Live</span></div>
    </div>`;
  if (!campaign.drafts_enabled) html += `<div class="note small">Post each video on TikTok, then paste its link below. In TikTok, tap Share, then Copy link.</div>`;

  html += `<div class="slots">` + slots.map(slotCard).join("") + `</div>`;
  html += `<p class="muted small center" style="margin-top:32px">Questions? Reply to the email you got from us.<br>This page is personal to you, so please don't share the link.</p>`;
  app.innerHTML = html;
  bindSlots();
}


// small vertical thumbnail (or the video number when there's none yet)
const thumbBox = (n, v) => v?.thumb_url
  ? `<img class="slot-thumb" src="${esc(v.thumb_url)}" alt="Video ${n}">`
  : `<div class="slot-thumb empty">${n}</div>`;

const linkForm = (n, s) => `<form class="row" data-link="${n}" style="flex-wrap:nowrap">
    <input type="url" inputmode="url" placeholder="Paste your TikTok link" value="${s.status === "posted" ? esc(s.tiktok_url) : ""}" required>
    <button type="submit">${s.status === "posted" ? "Update" : "Send"}</button></form>
  <div data-linkerr="${n}"></div>`;

function slotCard(s) {
  const n = s.slot_no;
  const last = s.versions[s.versions.length - 1];
  const up = uploading[n];
  const drafts = state.campaign.drafts_enabled;
  let body = "", pill, sub = "";

  if (!drafts && !up) {
    pill = s.status === "posted" ? `<span class="pill s-posted">Live on TikTok</span>` : `<span class="pill s-empty">Link needed</span>`;
    sub = s.status === "posted" ? `<a href="${esc(s.tiktok_url)}" target="_blank" rel="noopener">Open on TikTok</a>` : "Post it, then paste the link";
    body = linkForm(n, s);
  } else {
    pill = `<span class="pill s-${up ? "pending" : s.status}">${up ? "Uploading" : STATUS_LABEL[s.status]}</span>`;
    if (last) sub = `${esc(last.file_name || "")}${last.version_no > 1 ? `, version ${last.version_no}` : ""}`;
    if (up) {
      sub = esc(up.name);
      body = `<div class="stack">
        <div class="row spread small"><span class="muted">Keep this page open while it uploads.</span><b id="pct${n}">${up.pct}%</b></div>
        <div class="progress"><i id="bar${n}" style="width:${up.pct}%"></i></div>
        <div><button class="ghost sm" data-cancel="${n}">Cancel</button></div></div>`;
    } else if (s.status === "empty" || s.status === "changes_requested") {
      if (s.status === "changes_requested" && last?.feedback) {
        body += `<div class="feedback"><div class="small" style="font-weight:600;margin-bottom:4px">Feedback from Stellar</div>${esc(last.feedback)}</div>`;
      }
      body += `<label class="drop" data-drop="${n}">
        <input type="file" accept="video/*" data-file="${n}" class="hidden">
        <b>${s.status === "changes_requested" ? "Upload a new draft" : "Upload your draft"}</b>
        <div class="muted small" style="margin-top:2px">MP4 or MOV, up to 1 GB</div></label>`;
    } else if (s.status === "pending") {
      body = `<p class="muted small" style="margin:0">Sent ${fmtDate(last?.uploaded_at)}. We'll email you as soon as it's reviewed.</p>`;
    } else if (s.status === "approved" || s.status === "posted") {
      if (last?.feedback) body += `<div class="note small"><b>Note from Stellar:</b> ${esc(last.feedback)}</div>`;
      if (s.status === "approved") {
        const othersOpen = state.slots.some(o => o.slot_no !== n && !["approved", "posted"].includes(o.status));
        body += `<p class="small" style="margin:0">Approved! ${othersOpen ? "You can post this one now, no need to wait for your other videos. " : ""}Post it on TikTok, then paste the link here.</p>`;
      }
      else body += `<p class="small" style="margin:0"><a href="${esc(s.tiktok_url)}" target="_blank" rel="noopener">Open your TikTok</a></p>`;
      body += linkForm(n, s);
    }
  }

  const hist = drafts && s.versions.length > 1 ? `<details><summary>Earlier versions (${s.versions.length - 1})</summary><ul class="hist">${
    s.versions.slice(0, -1).reverse().map(v => `<li class="row" style="flex-wrap:nowrap;align-items:flex-start">${v.thumb_url ? `<img src="${esc(v.thumb_url)}" alt="" style="width:32px;border-radius:4px;flex:none">` : ""}<span>Version ${v.version_no}, ${fmtDate(v.uploaded_at)}: <b>${
      v.review_status === "pending" ? "waiting" : v.review_status === "approved" ? "approved" : v.review_status === "skipped" ? "not needed" : "changes requested"}</b>${v.feedback ? `<br><span class="muted">${esc(v.feedback)}</span>` : ""}</span></li>`).join("")
  }</ul></details>` : "";

  return `<section class="card slot" id="slot${n}">
    <div class="slot-head">
      ${thumbBox(n, drafts ? last : null)}
      <div class="slot-title"><h2>Video ${n}</h2>${sub ? `<div class="small muted">${sub}</div>` : ""}</div>
      ${pill}
    </div>
    ${body ? `<div class="stack">${body}</div>` : ""}${hist}</section>`;
}

function bindSlots() {
  app.querySelectorAll("[data-file]").forEach(inp => inp.onchange = () => {
    if (inp.files[0]) startUpload(Number(inp.dataset.file), inp.files[0]);
  });
  app.querySelectorAll("[data-drop]").forEach(d => {
    d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) startUpload(Number(d.dataset.drop), f); };
  });
  app.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => {
    const n = Number(b.dataset.cancel); const u = uploading[n];
    if (u?.upload) u.upload.abort(true);
    delete uploading[n]; render();
  });
  app.querySelectorAll("[data-link]").forEach(f => f.onsubmit = async (e) => {
    e.preventDefault();
    const n = Number(f.dataset.link); const url = f.querySelector("input").value.trim();
    const btn = f.querySelector("button"); btn.disabled = true;
    try { await api("submit_link", { slot_no: n, url }); toast("Thanks! Link saved."); await load(); }
    catch (err) { app.querySelector(`[data-linkerr="${n}"]`).innerHTML = `<div class="error small">${esc(err.message)}</div>`; btn.disabled = false; }
  });
}

// ---------- thumbnail: grab a frame from the video on this device ----------
function makeThumb(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    let done = false;
    const finish = (blob) => { if (done) return; done = true; URL.revokeObjectURL(url); v.removeAttribute("src"); resolve(blob); };
    setTimeout(() => finish(null), 8000);
    v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url;
    v.onloadedmetadata = () => { try { v.currentTime = Math.min(1, (v.duration || 2) * 0.25); } catch { finish(null); } };
    v.onseeked = () => {
      try {
        const w = 360, h = Math.round(w * (v.videoHeight || 640) / (v.videoWidth || 360));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        c.toBlob((b) => finish(b), "image/jpeg", 0.75);
      } catch { finish(null); }
    };
    v.onerror = () => finish(null);
  });
}

async function uploadThumb(file, session) {
  if (!session.thumb_path || !session.thumb_token) return false;
  const blob = await makeThumb(file);
  if (!blob) return false;
  const r = await fetch(`${SLM.SUPABASE_URL}/storage/v1/object/upload/sign/thumbs/${session.thumb_path}?token=${encodeURIComponent(session.thumb_token)}`, {
    method: "PUT", headers: { apikey: SLM.KEY, "Content-Type": "image/jpeg" }, body: blob,
  });
  return r.ok;
}

// ---------- resumable upload ----------
const resumeKey = (n, f) => `slm:${T}:${n}:${f.name}:${f.size}:${f.lastModified}`;

async function startUpload(n, file) {
  if (file.type && !file.type.startsWith("video/")) return toast("Please choose a video file.");
  if (file.size > 1024 ** 3) return toast("That file is over 1 GB. Please export a smaller version (1080p is perfect).", 6000);

  let session = null;
  try { session = JSON.parse(localStorage.getItem(resumeKey(n, file)) || "null"); } catch {}
  if (!session || Date.now() - session.at > 90 * 60 * 1000) {
    try {
      const r = await api("start_upload", { slot_no: n, file_name: file.name, size: file.size, mime: file.type });
      session = { path: r.path, token: r.token, thumb_path: r.thumb_path, thumb_token: r.thumb_token, at: Date.now() };
      try { localStorage.setItem(resumeKey(n, file), JSON.stringify(session)); } catch {}
    } catch (e) { return toast(e.message, 6000); }
  }

  uploading[n] = { name: file.name, pct: 0 };
  render();
  const thumbDone = uploadThumb(file, session).catch(() => false);

  const upload = new tus.Upload(file, {
    endpoint: `${SLM.STORAGE_URL}/storage/v1/upload/resumable`,
    retryDelays: [0, 2000, 5000, 10000, 20000, 30000, 60000],
    headers: { "x-signature": session.token, apikey: SLM.KEY },
    uploadDataDuringCreation: true,
    removeFingerprintOnSuccess: true,
    chunkSize: 6 * 1024 * 1024,
    metadata: { bucketName: "drafts", objectName: session.path, contentType: file.type || "video/mp4", cacheControl: "3600" },
    onProgress(sent, total) {
      const pct = Math.floor((sent / total) * 100);
      uploading[n].pct = pct;
      const p = document.getElementById("pct" + n), b = document.getElementById("bar" + n);
      if (p) p.textContent = pct + "%"; if (b) b.style.width = pct + "%";
    },
    async onSuccess() {
      try {
        const thumb = await Promise.race([thumbDone, new Promise(r => setTimeout(() => r(false), 10000))]);
        await api("finish_upload", { slot_no: n, path: session.path, file_name: file.name, size: file.size, mime: file.type, thumb: !!thumb });
        try { localStorage.removeItem(resumeKey(n, file)); } catch {}
        delete uploading[n];
        toast(`Video ${n} received! We'll email you after review.`, 5000);
        await load();
      } catch (e) { delete uploading[n]; toast(e.message, 6000); render(); }
    },
    onError(err) {
      delete uploading[n];
      try { localStorage.removeItem(resumeKey(n, file)); } catch {}
      toast("Upload failed. Please check your connection and try again.", 6000);
      console.error(err); render();
    },
  });
  uploading[n].upload = upload;
  const prev = await upload.findPreviousUploads().catch(() => []);
  if (prev.length) upload.resumeFromPreviousUpload(prev[0]);
  upload.start();
}

window.addEventListener("beforeunload", (e) => { if (Object.keys(uploading).length) { e.preventDefault(); e.returnValue = ""; } });

if (!T) app.innerHTML = `<div class="eyebrow">Stellar</div><h1>Link missing</h1><p class="muted">Please open the full link from your email.</p>`;
else load();
</script>
</body>
</html>
